<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mesa de operações · Trader Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;gap:4px}
button{font:inherit;color:#fff;border:1px solid rgba(139,108,255,.55);background:rgba(40,28,110,.7);border-radius:10px;padding:0 6px;min-height:34px;cursor:pointer;touch-action:manipulation;white-space:nowrap}

button.buy.on{background:#26D07C;border-color:#26D07C;color:#06240F}
button.sell.on{background:#FF4D6D;border-color:#FF4D6D;color:#2B0510}

.row{display:flex;gap:4px}.row>*{flex:1 1 0;min-width:0}
#hd{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:12px;border:1px solid rgba(139,108,255,.45);background:linear-gradient(160deg,rgba(60,44,150,.5),rgba(18,12,56,.92));min-height:30px}

.pill{padding:1px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#F2B84B;color:#1A1030;margin-left:4px}

#tm.fim{color:#FF4D6D}#tm.pisca{animation:pb .6s infinite alternate}
@keyframes pb{from{opacity:1}to{opacity:.3}}
#fs{flex:none;min-height:26px;width:30px;padding:0}
.tbr button{font-size:11px;font-weight:800;padding:0 2px;min-height:36px}

#dica{position:absolute;left:6px;top:6px;max-width:75%;padding:3px 8px;border-radius:8px;background:rgba(242,184,75,.95);color:#1A1030;font-size:11px;font-weight:800;pointer-events:none;display:none}
#baixo{position:absolute;left:6px;bottom:20px;max-width:70%;padding:3px 8px;border-radius:8px;background:rgba(255,77,109,.92);color:#fff;font-size:10px;font-weight:800;pointer-events:none;display:none;z-index:2}
#mais{position:absolute;right:6px;top:6px;display:none;flex-direction:column;gap:3px;padding:6px;border-radius:12px;background:rgba(18,12,56,.97);border:1px solid #8B6CFF;z-index:3;width:176px;max-height:calc(100% - 12px);overflow:auto}

#mais button{min-height:30px;font-size:11px;text-align:left;padding:0 8px}
#nota{position:absolute;left:6px;right:6px;bottom:6px;display:none;gap:4px;z-index:3}
#nota input{flex:1;min-width:0;border-radius:10px;border:1px solid #8B6CFF;background:#120C38;color:#fff;padding:0 10px;min-height:36px;font-size:16px;-webkit-user-select:text;user-select:text}
#res{position:absolute;left:6px;right:6px;bottom:6px;max-height:64%;overflow:auto;display:none;z-index:4;border-radius:14px;border:1px solid #8B6CFF;background:rgba(18,12,56,.96);padding:8px;box-shadow:0 0 18px rgba(0,0,0,.5)}
#res img.selo{float:right;width:108px;height:auto;margin:-6px 0 0 8px;border-radius:0;background:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));animation:selo .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes selo{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
#res img{display:block;width:100%;height:72px;object-fit:contain;border-radius:10px;margin-bottom:6px;background:#120C38}
#res .n{font-size:26px;font-weight:900;line-height:1;color:#F2B84B}#res small{color:#D9D4F7;font-size:11px}
#res .ch{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}#res .ch span{border:1px solid #8B6CFF;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
#res details{margin:4px 0;font-size:11px;color:#D9D4F7}#res details summary{font-weight:800;cursor:pointer}#res details p{margin:4px 0}
#res button{width:100%;min-height:42px;font-weight:900;font-size:14px;background:linear-gradient(90deg,#2EE86B,#14C9B5);border:0;color:#06240F}
#sm{padding:4px 8px;border-radius:12px;border:1px solid rgba(139,108,255,.45);background:linear-gradient(160deg,rgba(60,44,150,.4),rgba(18,12,56,.9));font-size:11px;line-height:1.25}
#sm .l1{display:flex;gap:8px;font-weight:800;flex-wrap:wrap}
#sm .e{color:#4B8BFF}#sm .s{color:#FF4D6D}#sm .a{color:#26D07C}
#sm .l2{color:#D9D4F7;margin-top:1px}#sm .er{color:#FFB0BD;font-weight:800}#sm .ok{color:#8DF5C1;font-weight:800}
#bt{display:flex;gap:4px}
#bt button{min-height:40px;font-weight:900;font-size:13px}
#bt #conf{flex:1;background:linear-gradient(90deg,#2EE86B,#14C9B5);border:0;color:#06240F;box-shadow:0 0 14px rgba(46,232,107,.35)}
#bt #conf[disabled]{background:#3a3560;color:#9a95c2;box-shadow:none}
#bt #rep{flex:0 0 38%;display:none}
#pgw{display:none;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}#pg{height:100%;width:0;background:linear-gradient(90deg,#2EE86B,#14C9B5);transition:width .5s linear}
#app.replay #pgw{display:block}#app.replay .tbr,#app.replay #bt{display:none}
#app.locked #cv,#app.locked .tbr,#app.locked #bt{pointer-events:none;opacity:.6}
#app.xs #tk{font-size:12px}#app.xs .tbr button{font-size:9.5px;padding:0 1px}#app.xs .ar{display:none}#app.xs #sm{font-size:10px}
#app.land{display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-rows:auto auto 1fr auto auto;gap:4px}
#app.land #cvw{grid-column:1;grid-row:1/-1}
#app.land>:not(#cvw){grid-column:2}#app.land .tbr{flex-wrap:wrap}#app.land .tbr button{flex:1 1 30% !important;min-height:32px}#app.land{overflow-x:hidden;overflow-y:auto}#app.land #hd{min-height:28px}
</style></head><body>
<div id="app">
  <div id="hd"><div id="tk"></div><div id="rod"></div><div id="tm">--:--</div><button id="fs" title="Tela cheia" style="display:none">⛶</button></div>
  <div class="row tbr" id="t2"><button id="b-buy" class="buy" style="flex:1.3"><span class="ar">▲ </span>Compra</button><button id="b-sell" class="sell" style="flex:1.25"><span class="ar">▼ </span>Venda</button>
    <button id="b-entrada" style="flex:1.2">Entrada</button><button id="b-stop">Stop</button><button id="b-alvo">Alvo</button>
    <button id="b-apagar" title="Apagar marcação" style="flex:.7">⌫</button><button id="b-limpar" title="Limpar operação" style="flex:.7">✕</button><button id="b-mais" style="flex:.7">⋯</button></div>
  <div id="cvw"><canvas id="cv"></canvas><div id="dica"></div><div id="baixo">Tela muito baixa: use ⛶ (tela cheia) ou gire para vertical.</div>
    <div id="mais"><div class="g">ESTRATÉGIA</div><button id="b-tipo"></button><button id="b-conf"></button><div class="g">INDICADORES</div><button data-i="vol">Volume</button><button data-i="sma">Média simples (20)</button><button data-i="ema">Média exponencial (9)</button><button data-i="rsi">RSI (14)</button><button data-i="sr">Suporte/Resistência</button>
      <div class="g">MARCAÇÕES DE ANÁLISE</div><button data-t="nivel">Nível de preço</button><button data-t="tend">Linha de tendência</button><button data-t="nota">Anotação</button></div>
    <div id="res"></div>
    <div id="nota"><input id="nota-t" maxlength="40" placeholder="Texto curto"><button id="nota-ok">OK</button></div></div>
  <div id="pgw"><div id="pg"></div></div>
  <div id="sm"></div>
  <div id="bt"><button id="conf">Confirmar estratégia</button><button id="rep">Iniciar replay</button></div>
</div>
<script>
"use strict";
/* ===== Geometria e regras puras (testáveis; espelham trader_battle.validar_estrategia) ===== */
const Geo={
  priceAt(y,top,h,lo,hi){return hi-((y-top)/h)*(hi-lo)},
  yAt(p,top,h,lo,hi){return top+((hi-p)/(hi-lo))*h},
  r2(p){return Math.round(p*100)/100},
  validar(s,ref){
    const L=s.lines,o={ok:false,msg:"",risco:null,retorno:null,rr:null,pStop:null,pAlvo:null};
    if(s.tipo==="aguardar"){o.ok=true;o.msg="Aguardar: você fica de fora desta rodada.";return o}
    if(s.dir!=="alta"&&s.dir!=="baixa"){o.msg="Escolha COMPRA ou VENDA.";return o}
    const f=[["entrada","Entrada"],["stop","Stop"],["alvo","Alvo"]].filter(k=>L[k[0]]==null).map(k=>k[1]);
    if(L.entrada!=null&&L.stop!=null){o.risco=Math.abs(L.entrada-L.stop);o.pStop=(L.stop/L.entrada-1)*100}
    if(L.entrada!=null&&L.alvo!=null){o.retorno=Math.abs(L.alvo-L.entrada);o.pAlvo=(L.alvo/L.entrada-1)*100}
    if(o.risco>0&&o.retorno!=null)o.rr=o.retorno/o.risco;
    if(f.length){o.msg="Falta marcar no gráfico: "+f.join(", ")+".";return o}
    const e=L.entrada,st=L.stop,a=L.alvo;
    const bom=s.dir==="alta"?(st<e&&e<a):(a<e&&e<st);
    if(!bom){o.msg=s.dir==="alta"?"Inválido: na COMPRA o stop fica abaixo e o alvo acima da entrada.":"Inválido: na VENDA o alvo fica abaixo e o stop acima da entrada.";return o}
    if(ref&&Math.abs(e/ref-1)>0.08){o.msg="Inválido: entrada a mais de 8% do preço atual.";return o}
    o.ok=true;return o;
  }
};
const TIPOS=["continuacao","reversao","rompimento","aguardar"],ROT={continuacao:"Continuação",reversao:"Reversão",rompimento:"Rompimento",aguardar:"Aguardar"};
const COR={e:"#4B8BFF",s:"#FF4D6D",a:"#26D07C",up:"#26D07C",dn:"#FF4D6D",niv:"#A78BFA",gold:"#F2B84B",sma:"#F2B84B",ema:"#4DD0E1",rsi:"#C4B5FF"};
const NOME={entrada:"ENT",stop:"STOP",alvo:"ALVO"},CORL={entrada:COR.e,stop:COR.s,alvo:COR.a};
const $=id=>document.getElementById(id);
let A=null,S=null,cv,ctx,W=0,H=0,L={},T0=0,frozen=null,raf=0;
const fmt=p=>p==null?"—":p.toFixed(2).replace(".",",");
const pc=p=>p==null?"":(p>=0?"+":"−")+Math.abs(p).toFixed(1).replace(".",",")+"%";

/* ===== Streamlit (protocolo de componente sem build) ===== */
const host=window.parent;
function post(o){host.postMessage(Object.assign({isStreamlitMessage:true},o),"*")}
function setH(h){post({type:"streamlit:setFrameHeight",height:Math.round(h)})}
window.addEventListener("message",ev=>{
  const d=ev.data;if(!d||d.type!=="streamlit:render")return;
  onRender(d.args||{});
});

/* ===== Estado ===== */
function sma(c,n){const o=[];let s=0;for(let i=0;i<c.length;i++){s+=c[i].c;if(i>=n)s-=c[i-n].c;o.push(i>=n-1?s/n:null)}return o}
function ema(c,n){const o=[],k=2/(n+1);let e=null;for(let i=0;i<c.length;i++){if(i<n-1){o.push(null);continue}
  if(e==null){let s=0;for(let j=i-n+1;j<=i;j++)s+=c[j].c;e=s/n}else e=c[i].c*k+e*(1-k);o.push(e)}return o}
function rsi(c,n){const o=c.map(()=>null);if(c.length<=n)return o;let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i].c-c[i-1].c;if(d>=0)g+=d;else l-=d}g/=n;l/=n;
  o[n]=l===0?100:100-100/(1+g/l);
  for(let i=n+1;i<c.length;i++){const d=c[i].c-c[i-1].c;g=(g*(n-1)+(d>0?d:0))/n;l=(l*(n-1)+(d<0?-d:0))/n;o[i]=l===0?100:100-100/(1+g/l)}return o}
function novoEstado(a){
  const ini=a.inicial||{},m=ini.marcas||{};
  const s={dir:ini.direcao==="alta"||ini.direcao==="baixa"?ini.direcao:null,tipo:TIPOS.includes(ini.tipo)?ini.tipo:"continuacao",conf:ini.confianca||3,
    lines:{entrada:ini.entrada??null,stop:ini.stop??null,alvo:ini.alvo??null},
    marcas:{niveis:(m.niveis||[]).map(x=>({...x})),tendencias:(m.tendencias||[]).map(x=>({...x})),notas:(m.notas||[]).map(x=>({...x}))},
    ind:{vol:true,sma:true,ema:false,rsi:false,sr:false},tool:null,pend:null,notaPend:null,cw:0,off:0,seq:0,sentSeq:0,sentSig:null,savedSig:null,erroLocal:"",locked:false,timeoutSent:false,fila:[],fT:0,fStep:300};
  return s;
}
const sig=()=>JSON.stringify([S.dir,S.tipo,S.conf,S.lines,S.marcas]);
function aplicaOp(a){const ini=a.inicial||{};
  S.dir=ini.direcao==="alta"||ini.direcao==="baixa"?ini.direcao:null;S.tipo=TIPOS.includes(ini.tipo)?ini.tipo:"continuacao";S.conf=ini.confianca||3;
  S.lines={entrada:ini.entrada??null,stop:ini.stop??null,alvo:ini.alvo??null}}
function cresce(a){   // candles novos já liberados pelo servidor entram no MESMO gráfico, com a animação suave de sempre
  const tem=S.cands.length+S.fila.length;
  if(a.candles.length>tem){const novos=a.candles.slice(tem);
    if(S.modo!=="analise"&&S.cands.length>0){                       // candles já liberados pelo servidor entram um a um (fila), no ritmo da chegada
      S.fStep=Math.max(70,Math.min(420,950/Math.max(1,S.fila.length+novos.length)));S.fila.push(...novos);S.fT=Math.min(S.fT||0,performance.now());kick()}
    else{S.cands=S.cands.concat(novos);cache()}}
  else if(a.candles.length<tem){S.fila=[];S.cands=a.candles;cache()}
}
function modoClasses(){const m=S.modo!=="analise";$("app").classList.toggle("replay",m)}
function transicao(a){   // mudou de fase/rodada: o gráfico, o zoom e os desenhos pessoais permanecem
  const velho=S.modo,nova=S.rodada!==a.rodada;
  S.fk=a.fase_key;S.modo=a.modo;S.locked=false;S.timeoutSent=false;$("app").classList.remove("locked");S.tool=null;S.pend=null;
  if(nova){S.savedSig=null;S.sentSig=null;S.erroLocal="";S.notaPend=null;$("nota").style.display="none";$("mais").style.display="none";S.rodada=a.rodada;aplicaOp({})}
  if(a.modo!=="analise")aplicaOp(a);
  if(a.modo==="analise"&&a.inicial&&a.inicial.tipo){aplicaOp(a);S.savedSig=sig()}
  cresce(a);modoClasses();
  if(a.modo!=="analise"){S.follow=true;if(velho==="analise")S.domNovo=true}
  if(a.modo==="analise"){S.dom=null;S.follow=true}
  S.res=null;
}
function onRender(a){
  a.modo=a.modo||"analise";a.fase_key=a.fase_key||(a.rodada+"-"+a.modo);
  const novo=!A||A.token!==a.token;A=a;
  if(novo){
    S=novoEstado(a);S.cands=a.candles;cache();S.modo=a.modo;S.fk=a.fase_key;S.rodada=a.rodada;S.follow=true;S.seq=Math.max(S.seq,a.seq0||0);
    const mm=a.inicial&&a.inicial.marcas,tem=m=>m&&["niveis","tendencias","notas"].some(k=>(m[k]||[]).length);
    if(!tem(mm)&&tem(a.marcas_ant))S.marcas={niveis:(a.marcas_ant.niveis||[]).map(x=>({...x})),tendencias:(a.marcas_ant.tendencias||[]).map(x=>({...x})),notas:(a.marcas_ant.notas||[]).map(x=>({...x}))};
    if(a.inicial&&(a.inicial.tipo)){S.savedSig=sig()}
    modoClasses();zoomInicial();
    if(S.modo!=="analise"){S.domNovo=true}
  }else if(a.fase_key!==S.fk){transicao(a)}
  else{cresce(a)}
  clearTimeout(S.nextT);
  if(S.modo==="replay"&&a.prox_ms!=null)S.nextT=setTimeout(()=>send("prox"),a.prox_ms+150);          // pede o próximo candle no instante certo (sem esperar o ciclo de 1 s)
  const nT=performance.now()+a.seg*1000;if(novo||Math.abs(nT-T0)>1500||a.modo!=="analise")T0=nT;   // na análise o relógio local só é corrigido se desviar mais de 1,5 s
  if(a.ok_seq&&a.ok_seq===S.sentSeq&&S.sentSeq>0){S.savedSig=S.sentSig}
  if(a.erro&&a.erro_seq===S.sentSeq){S.erroLocal=a.erro}else if(a.ok_seq===S.sentSeq){S.erroLocal=""}
  if(S.modo!=='analise'){const n=S.cands.length;S.offAlvo=n+3-(W-axisW())/S.cw}
  $("tk").innerHTML=`${esc(a.ticker)}${a.demo?'<span class="pill">SIMULADO</span>':""}<small>R$ ${fmt(a.ref)} · ${esc(a.tf_nome)}</small>`;
  $("rod").textContent=`Rodada ${a.rodada}/${a.rodadas}`;
  resultado(a);
  fit();ui();draw();kick();
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cache(){const c=S.cands;S.smaV=sma(c,20);S.emaV=ema(c,9);S.rsiV=rsi(c,14)}
function zoomInicial(){const n=S.cands.length,pw=Math.max(100,(W||300)-axisW());const vis=Math.min(n,45);S.cw=pw/(vis+3);S.off=Math.max(-3,n-vis)}
const axisW=()=>(W<360?40:46);

/* ===== Layout e tamanho (altura real da área visível) ===== */
function fit(){
  const app=$("app");let h;
  const fsOn=!!document.fullscreenElement;
  if(fsOn){h=window.innerHeight}
  else{
    try{
      const pw=host,fe=window.frameElement,top=fe.getBoundingClientRect().top;
      let bottom=10;
      const b=pw.document.querySelector(".st-key-area_btn_jogar");
      if(b){const blk=b.closest('[data-testid="stHorizontalBlock"]')||b,r=blk.getBoundingClientRect();if(r.top>pw.innerHeight*0.4)bottom=pw.innerHeight-r.top+6}
      h=pw.innerHeight-top-bottom;
    }catch(e){h=Math.max(480,window.innerHeight)}
  }
  h=Math.max(150,Math.min(1400,h));
  const w=document.documentElement.clientWidth||window.innerWidth;
  app.classList.toggle("xs",w<360);
  app.classList.toggle("land",h<430&&w>=520);
  if(!fsOn&&Math.abs((window.innerHeight)-h)>1)setH(h);
  $("fs").style.display=document.fullscreenEnabled?"":"none";
  $("baixo").style.display=(h<260&&!fsOn)?"block":"none";
  resize();
}
function resize(){
  const w=$("cvw");if(!w||!cv)return;const r=w.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(r.width<2||r.height<2)return;
  W=Math.round(r.width);H=Math.round(r.height);
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
  if(S&&!S.zi){S.zi=1;zoomInicial()}
  draw();
}

/* ===== Desenho ===== */
function dominio(){
  const {i0,i1}=visiveis();let lo=Infinity,hi=-Infinity;
  for(let i=i0;i<=i1;i++){const c=S.cands[i];if(!c)continue;lo=Math.min(lo,c.l);hi=Math.max(hi,c.h)}
  if(!isFinite(lo)){lo=0;hi=1}
  for(const k of ["entrada","stop","alvo"]){const p=S.lines[k];if(p!=null){lo=Math.min(lo,p);hi=Math.max(hi,p)}}
  const pad=(hi-lo)*0.07||hi*0.01;return [lo-pad,hi+pad];
}
function visiveis(){const pw=W-axisW();return {i0:Math.max(0,Math.floor(S.off)),i1:Math.min(S.cands.length-1,Math.ceil(S.off+pw/S.cw))}}
function layout(){
  const rsiOn=S.ind.rsi,tH=14,rH=rsiOn?Math.round((H-tH)*0.22):0,mH=H-tH-rH-(rsiOn?4:0);
  const [lo,hi]=frozen||(S.modo!=="analise"&&S.dom)||dominio();
  L={pw:W-axisW(),mTop:2,mH:mH-4,lo,hi,rTop:mH+4,rH,tH};
  L.y=p=>Geo.yAt(p,L.mTop,L.mH,L.lo,L.hi);L.price=y=>Geo.priceAt(y,L.mTop,L.mH,L.lo,L.hi);

/* ===== Interação (mouse e toque) ===== */
const ptrs=new Map();let modo=null,t0=null,pinch=null;
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function objetos(){
  const o=[];for(const k of ["entrada","stop","alvo"])if(S.lines[k]!=null)o.push({tipo:"linha",k,p:S.lines[k]});
  S.marcas.niveis.forEach((n,i)=>o.push({tipo:"nivel",i,p:n.preco}));return o;
}
function achar(pt,raio){
  let best=null,bd=raio;
  for(const o of objetos()){const d=Math.abs(L.y(o.p)-pt.y);if(d<bd){bd=d;best=o}}
  return best;
}
function acharApagar(pt){
  const raio=36;let best=achar(pt,raio),bd=best?Math.abs(L.y(best.p)-pt.y):raio;
  S.marcas.notas.forEach((n,i)=>{const d=Math.hypot(L.x(n.i)-pt.x,L.y(n.preco)-pt.y);if(d<bd){bd=d;best={tipo:"nota",i}}});
  S.marcas.tendencias.forEach((t,i)=>{const x1=L.x(t.i1),y1=L.y(t.p1),x2=L.x(t.i2),y2=L.y(t.p2),k=(y2-y1)/((x2-x1)||1);const y=y1+k*(pt.x-x1);if(pt.x>=x1-10){const d=Math.abs(y-pt.y);if(d<bd){bd=d;best={tipo:"tend",i}}}});
  return best;
}
function candleEm(x){return Math.max(0,Math.min(S.cands.length-1,Math.round((x-S.cw/2)/S.cw+S.off)))}

  t0={x:p.x,y:p.y,t:performance.now(),moved:false,off:S.off};layout();
  if(p.x>L.pw){modo="pan";return}
  const hit=(S.tool==null&&S.modo==="analise")?achar(p,e.pointerType==="mouse"?10:24):null;
  if(hit){modo="drag";t0.hit=hit;frozen=[L.lo,L.hi]}else modo="pan";
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;const p=pos(e);ptrs.set(e.pointerId,p);
  if(modo==="pinch"&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    S.cw=Math.max(3,Math.min(40,pinch.cw*d/pinch.d));S.off=pinch.idx-(pinch.mx-S.cw/2)/S.cw;limita();draw();return}
  if(!t0)return;
  if(Math.hypot(p.x-t0.x,p.y-t0.y)>6)t0.moved=true;
  if(modo==="drag"&&t0.moved){
    let pr=Geo.r2(Math.max(L.lo,Math.min(L.hi,L.price(p.y))));
    if(pr<=0)return;const h=t0.hit;
    if(h.tipo==="linha")S.lines[h.k]=pr;else S.marcas.niveis[h.i].preco=pr;
    ui();draw();
  }else if(modo==="pan"&&t0.moved){S.follow=false;S.off=t0.off-(p.x-t0.x)/S.cw;limita();draw()}
});
function fim(e){
  const p=ptrs.get(e.pointerId)||pos(e);ptrs.delete(e.pointerId);
  if(modo==="pinch"){if(ptrs.size<2){modo=null;pinch=null;t0=null}return}
  const tap=t0&&!t0.moved&&performance.now()-t0.t<600;
  if(modo==="drag"){frozen=null;draw()}
  if(tap&&modo==="pan"&&p.x<=L.pw&&S.tool)toque(p);
  modo=null;t0=null;frozen=null;

cv.addEventListener("pointerup",fim);cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);modo=null;t0=null;frozen=null;pinch=null;draw()});

function limita(){const n=S.cands.length,pw=W-axisW();S.off=Math.max(-3,Math.min(n-pw/S.cw+3,S.off))}
function toque(p){
  layout();const t=S.tool,pr=Geo.r2(L.price(p.y));
  if(["entrada","stop","alvo"].includes(t)){if(pr>0){S.lines[t]=pr;S.tool=null}}
  else if(t==="nivel"){if(S.marcas.niveis.length>=A.limites.niveis){flash("Limite de níveis atingido");}else if(pr>0){S.marcas.niveis.push({preco:pr,rotulo:""});S.tool=null}}
  else if(t==="tend"){const i=candleEm(p.x),ref={i,p:pr};
    if(!S.pend)S.pend=ref;
    else if(S.pend.i===i){flash("Escolha um candle diferente")}
    else if(S.marcas.tendencias.length>=A.limites.tendencias){flash("Limite de tendências atingido");S.pend=null;S.tool=null}
    else{const a=S.pend,b=ref,[x,y]=a.i<b.i?[a,b]:[b,a];S.marcas.tendencias.push({i1:x.i,p1:x.p,i2:y.i,p2:y.p});S.pend=null;S.tool=null}}
  else if(t==="nota"){if(S.marcas.notas.length>=A.limites.notas){flash("Limite de anotações atingido");S.tool=null}else{S.notaPend={i:candleEm(p.x),preco:pr};$("nota").style.display="flex";$("nota-t").value="";setTimeout(()=>$("nota-t").focus(),50);S.tool=null}}
  else if(t==="apagar"){const h=acharApagar(p);if(h){if(h.tipo==="linha")S.lines[h.k]=null;else if(h.tipo==="nivel")S.marcas.niveis.splice(h.i,1);else if(h.tipo==="nota")S.marcas.notas.splice(h.i,1);else if(h.tipo==="tend")S.marcas.tendencias.splice(h.i,1)}else flash("Nada para apagar aqui")}
  ui();draw();
}

function escolhe(t){S.tool=S.tool===t?null:t;S.pend=null;$("mais").style.display="none";ui()}

const ease=t=>1-Math.pow(1-t,3);
let rt=0;
function kick(){if(raf)return;raf=requestAnimationFrame(loop);rt=setTimeout(()=>{if(raf){cancelAnimationFrame(raf);loop()}},48)}   // rAF normal; o temporizador garante o avanço se o navegador pausar quadros
function loop(){
  clearTimeout(rt);raf=0;if(!S||!W)return;let mexe=false;const now=performance.now();
  if(S.fila.length&&now>=S.fT){let n=0;                                 // libera os candles já devidos (se o navegador atrasou, recupera sem acelerar a animação)
    while(S.fila.length&&now>=S.fT&&n<8){S.cands.push(S.fila.shift());S.fT=Math.max(S.fT,now-S.fStep)+S.fStep;n++}
    cache();S.anim={i:S.cands.length-1,t0:now,dur:Math.min(650,S.fStep*1.6)};mexe=true;
    if(S.modo!=="analise")S.offAlvo=S.cands.length+3-(W-axisW())/S.cw}
  if(S.fila.length)mexe=true;
  if(S.anim){const t=Math.min(1,(now-S.anim.t0)/S.anim.dur);S.anim.e=ease(t);if(t>=1)S.anim=null;else mexe=true}
  if(S.modo!=="analise"){
    if(S.follow&&S.offAlvo!=null){const d=S.offAlvo-S.off;if(Math.abs(d)>0.01){S.off+=d*0.18;mexe=true}else S.off=S.offAlvo}
    const alvo=dominio();if(!S.dom||S.domNovo){S.dom=alvo;S.domNovo=false}
    else{const dl=(alvo[0]-S.dom[0]),dh=(alvo[1]-S.dom[1]);if(Math.abs(dl)+Math.abs(dh)>(alvo[1]-alvo[0])*0.002){S.dom=[S.dom[0]+dl*0.2,S.dom[1]+dh*0.2];mexe=true}else S.dom=alvo}
  }
  if(S.modo==="resultado"&&!S.fila.length&&!S.anim)resultado(A);          // o cartão de resultado entra quando o último candle terminou de aparecer
  draw();if(mexe)kick();
}
