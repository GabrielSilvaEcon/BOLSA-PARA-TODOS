name: tickerhunters
description: TickerHunters, jogo de investimentos (app novo, Flutter). Educativo, sem recomendação de compra ou venda.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  web: ^1.1.0
  webview_flutter: ^4.10.0
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/mascote.webp
    - assets/fundo_login.webp
    - assets/home/
    - assets/carteira/
    - assets/jogos/
    - assets/nav/
    - assets/cabecalho/
    - assets/mesa/
    - assets/logos/setores/
    - assets/logos/cripto/
    - assets/avatares/

# Ícone do app no Android (gerado no build do APK pelo robô app_apk): o mascote do TickerHunters
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icone/icone.png"
