[theme]
base = "dark"
primaryColor = "#8B6CFF"
backgroundColor = "#110C2E"
secondaryBackgroundColor = "#1B1442"
textColor = "#FFFFFF"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
enableStaticServing = true

[browser]
gatherUsageStats = false
