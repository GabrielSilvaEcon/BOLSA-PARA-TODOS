name: app_apk
# APK de teste do app novo (Android). A cada mudança em app/ (ou na mesa do Trade Battle), compila e publica em
# https://github.com/GabrielSilvaEcon/BOLSA-PARA-TODOS/releases/download/apk-teste/tickerhunters.apk
# Em pull request (ou rodando à mão num branch), só compila e guarda o APK como artefato (não troca o link de teste).
on:
  push:
    branches: [main]
    paths: ['app/**', 'trader_front/**', '.github/workflows/app_apk.yml']
  pull_request:
    paths: ['app/**', 'trader_front/**', '.github/workflows/app_apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Projeto Android e dependências
        working-directory: app
        run: |
          mkdir -p assets/mesa && cp ../trader_front/index.html assets/mesa/index.html   # mesa do Trade Battle (a mesma do app antigo)
          flutter create --project-name tickerhunters --org com.tickerhunters --platforms android . --no-overwrite || true
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="TickerHunters"#' $M
          flutter pub get
          dart run flutter_launcher_icons            # ícone do TickerHunters (app/icone/icone.png)
          dart run flutter_native_splash:create      # cor de fundo ao abrir (sem clarão branco antes da tela de abertura)
          flutter analyze --no-fatal-infos
      - name: Chave fixa do APK de teste
        # Sempre a MESMA chave (app/assinatura/teste.keystore, chave de teste no padrão "debug" do Android, sem valor secreto):
        # assim o celular aceita instalar a versão nova por cima da antiga. A versão da Play Store terá outra chave, guardada em segredo.
        run: mkdir -p ~/.android && cp app/assinatura/teste.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: app
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY --dart-define=VERSAO_APP=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../tickerhunters.apk
          ls -la ../tickerhunters.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tickerhunters-apk
          path: tickerhunters.apk
      - name: Publicar o link de teste
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-teste --yes --cleanup-tag || true
          echo '{"versao": ${{ github.run_number }}}' > versao.json        # o app compara com o número dele e avisa "Nova versão disponível"
          gh release create apk-teste tickerhunters.apk versao.json --prerelease --title "App de teste (Android)" \
            --notes "APK de teste do TickerHunters, gerado automaticamente a partir do branch main ($(git rev-parse --short HEAD)). Só para teste: não é a versão da Play Store."
