name: diag_apk
# APK de DIAGNÓSTICO (só para medir no celular; não é o app normal). Um por branch de medição:
#   diag-antes  = mesa ANTES da Etapa 3  → https://github.com/GabrielSilvaEcon/BOLSA-PARA-TODOS/releases/tag/diag-antes
#   diag-depois = mesa DEPOIS da Etapa 3 → https://github.com/GabrielSilvaEcon/BOLSA-PARA-TODOS/releases/tag/diag-depois
# Pacote próprio (instala ao lado do app normal e as duas versões convivem). Não toca no link apk-teste nem na main.
on:
  push:
    branches: [diag-antes, diag-depois]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diag-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROTULO: ${{ startsWith(github.ref_name, 'diag-') && github.ref_name || 'diag-manual' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Projeto Android e dependências
        working-directory: app
        run: |
          mkdir -p assets/mesa && cp ../trader_front/index.html assets/mesa/index.html   # mesa do Trade Battle (a mesma do app antigo)
          flutter create --project-name tickerhunters --org com.tickerhunters --platforms android . --no-overwrite || true
          rm -f test/widget_test.dart                # só o exemplo gerado pelo flutter create; os testes do app ficam
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          R=${ROTULO#diag-}
          sed -i "s#android:label=\"[^\"]*\"#android:label=\"TH Diag ${R^^}\"#" $M
          # pacote próprio para instalar ao lado do app normal e das duas versões de teste
          for G in android/app/build.gradle android/app/build.gradle.kts; do { [ -f $G ] && sed -E -i "s#applicationId[ =]+\"[^\"]*\"#applicationId = \"com.tickerhunters.diag${R}\"#" $G; } || true; done
          # volta do login com o Google: o Android abre o app por este endereço (esquema + host de app/lib/config.dart: linkGoogleApp)
          grep -q 'login-callback' $M || sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="io.supabase.tickerhunters" android:host="login-callback"/></intent-filter>\n        </activity>#' $M
          flutter pub get
          dart run flutter_launcher_icons            # ícone do TickerHunters (app/icone/icone.png)
          dart run flutter_native_splash:create      # cor de fundo ao abrir (sem clarão branco antes da tela de abertura)
          flutter analyze --no-fatal-infos
          flutter test
      - name: Chave fixa do APK de teste
        # Sempre a MESMA chave (app/assinatura/teste.keystore, chave de teste no padrão "debug" do Android, sem valor secreto):
        # assim o celular aceita instalar a versão nova por cima da antiga. A versão da Play Store terá outra chave, guardada em segredo.
        run: mkdir -p ~/.android && cp app/assinatura/teste.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: app
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY --dart-define=VERSAO_APP=${{ github.run_number }} --dart-define=DIAGNOSTICO=true --dart-define=DIAG_ROTULO=${ROTULO#diag-}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../th_diag_${ROTULO#diag-}.apk
          ls -la ../th_diag_${ROTULO#diag-}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: th-diag-apk
          path: th_diag_*.apk
      - name: Publicar o APK de diagnóstico (link fixo, só para teste)
        if: startsWith(github.ref_name, 'diag-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${ROTULO#diag-}
          gh release delete "$ROTULO" --yes --cleanup-tag || true
          gh release create "$ROTULO" "th_diag_$R.apk" --prerelease --title "Diagnóstico Android: $R" \
            --notes "APK de DIAGNÓSTICO (versão $R, commit $(git rev-parse --short HEAD)). Só para medir no celular; não é o app normal e não vai para a Play Store."
