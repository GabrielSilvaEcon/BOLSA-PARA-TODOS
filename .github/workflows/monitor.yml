name: monitor
# Monitor automático do Passo 23. Roda sozinho, mesmo com o app fechado. O GitHub pode atrasar alguns minutos.
# Horários em UTC: 12h-22h UTC = 9h-19h em Brasília (pregão da B3) em dias úteis, mais uma passada a cada 4 horas (cripto e fim de semana).
on:
  schedule:
    - cron: "*/15 12-22 * * 1-5"
    - cron: "5 */4 * * *"
  workflow_dispatch:
concurrency:
  group: monitor
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          BPT_SUPABASE_URL: ${{ secrets.BPT_SUPABASE_URL }}
          BPT_SUPABASE_KEY: ${{ secrets.BPT_SUPABASE_KEY }}
          BPT_EMAIL_SERVIDOR: ${{ secrets.BPT_EMAIL_SERVIDOR }}
          BPT_EMAIL_PORTA: ${{ secrets.BPT_EMAIL_PORTA }}
          BPT_EMAIL_USUARIO: ${{ secrets.BPT_EMAIL_USUARIO }}
          BPT_EMAIL_SENHA: ${{ secrets.BPT_EMAIL_SENHA }}
          BPT_EMAIL_REMETENTE: ${{ secrets.BPT_EMAIL_REMETENTE }}
          BPT_TELEGRAM_BOT_TOKEN: ${{ secrets.BPT_TELEGRAM_BOT_TOKEN }}
          BPT_APP_URL: ${{ secrets.BPT_APP_URL }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
